name: E2E Tests (Playwright + Fineract)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Specs that stub every Fineract call (playwright/config/mocked-specs.ts) plus
  # the browser-free `unit` project. No backend, so this runs in parallel with
  # the `e2e` job below, on 4 workers, against the production build.
  e2e-mocked:
    name: Playwright E2E (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      E2E_SUITE: mocked
      E2E_BASE_URL: http://localhost:4200
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build

      # Playwright starts scripts/serve-e2e-static.js itself (webServer).
      - name: Run mocked Playwright tests
        run: npm run playwright:ci:mocked

      - name: Summarize flaky tests
        if: always()
        continue-on-error: true
        run: node scripts/summarize-flaky-tests.js "$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-mocked
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-mocked
          path: test-results/
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      # Everything not covered by the `e2e-mocked` job.
      E2E_SUITE: backend
      E2E_BASE_URL: http://localhost:4200
      E2E_FINERACT_URL: https://localhost:8443
      E2E_USERNAME: mifos
      E2E_PASSWORD: password
      E2E_TENANT_ID: default
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      # Written by the `json` reporter in `npm run playwright:ci`. It sits inside
      # playwright-report/ so the existing upload keeps it on every run. That only
      # holds while `json` is listed after `html`: reporters finish in the order
      # listed, and the html reporter clears this folder when it finishes.
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Fineract takes over a minute to become healthy, so start it first and
      # let it boot while the runner installs dependencies and builds the app.
      # `up -d` only waits for Postgres here (Fineract's depends_on).
      - name: Start Fineract
        run: docker compose -f docker-compose.e2e.yml up -d db fineract

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build

      # `up -d` blocks until every `depends_on: condition: service_healthy`
      # dependency reports healthy, so Postgres and Fineract are already up by
      # the time this step returns. Readiness beyond that — Fineract seed data,
      # and the web-app container, which has no compose healthcheck — is probed
      # by `playwright/global-setup.ts` (pollFineract / pollWebApp), which runs
      # in CI as part of the test command below.
      # Serves the build above from a stock nginx image instead of building the
      # root Dockerfile, which would run `npm ci` and `ng build` a second time.
      - name: Start web app
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.prebuilt.yml up -d web-app

      - name: Run Playwright tests
        run: npm run playwright:ci

      - name: Summarize flaky tests
        if: always()
        # Reporting only: a problem in this step must never change the job result.
        continue-on-error: true
        run: node scripts/summarize-flaky-tests.js "$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Fineract ==="
          docker logs e2e-fineract --tail 100 2>&1 || true
          echo "=== PostgreSQL ==="
          docker logs e2e-postgres --tail 50 2>&1 || true
          echo "=== Web-App ==="
          docker logs e2e-web-app --tail 50 2>&1 || true
          echo "=== Memory ==="
          docker stats --no-stream || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Tear down E2E infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml down -v --remove-orphans
