name: Scan AI Agent Skills

on:
  push:
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'

jobs:
  scan:
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@f726e6acd86fa2a997ed56cb046188ff9ae0d947 # main
    with:
      # We tell the scanner to look at the skills directory
      skill_path: skills
    permissions:
      security-events: write
      contents: read
