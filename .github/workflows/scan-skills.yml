name: Scan AI Agent Skills

on:
  push:
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'

jobs:
  scan:
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@41fec4a9570ba1d195d12dbb0b4d140a35e63068 # main
    with:
      # We tell the scanner to look at the skills directory
      skill_path: skills
    permissions:
      security-events: write
      contents: read
