<h2 mat-dialog-title>{{ 'labels.heading.Loan Breach Actions' | translate }}</h2>

<div mat-dialog-content [formGroup]="breachActionForm">
  <div class="layout-column">
    <mat-checkbox class="flex-98" formControlName="restartPeriodFromResetDate">
      <p>{{ 'labels.inputs.Restart Period from Reset Date' | translate }}</p>
    </mat-checkbox>
    <p class="hint-text">
      {{ 'labels.dialogContext.Restart Period from Reset Date splits the current period' | translate }}
    </p>
  </div>
</div>

<mat-dialog-actions class="layout-row layout-xs-column layout-align-center gap-2percent">
  <button mat-raised-button mat-dialog-close>{{ 'labels.buttons.Cancel' | translate }}</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="{ data: breachActionForm }">
    {{ 'labels.buttons.Reset' | translate }}
  </button>
</mat-dialog-actions>
