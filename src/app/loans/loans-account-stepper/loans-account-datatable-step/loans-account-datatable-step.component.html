<mifosx-loan-form-section [section]="section" />

<div class="layout-row align-center gap-2percent margin-t responsive-column stepper-buttons">
  <button mat-raised-button type="button" matStepperPrevious>
    <fa-icon icon="arrow-left" class="m-r-10"></fa-icon>
    {{ 'labels.buttons.Previous' | translate }}
  </button>
  <button mat-raised-button type="button" matStepperNext (click)="form.markAllAsTouched()">
    {{ 'labels.buttons.Next' | translate }}
    <fa-icon icon="arrow-right" class="m-l-10"></fa-icon>
  </button>
</div>
