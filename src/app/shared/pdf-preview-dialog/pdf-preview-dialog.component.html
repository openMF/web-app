<h1 mat-dialog-title class="pdf-preview-title">
  {{ data.title || ('labels.heading.Document Preview' | translate) }}
</h1>
<div mat-dialog-content class="pdf-preview-content">
  <embed
    class="pdf-preview-embed"
    [src]="safeUrl"
    type="application/pdf"
    [attr.aria-label]="data.fileName || data.title"
  />
</div>
<mat-dialog-actions align="end">
  <button mat-raised-button (click)="openInNewTab()">
    {{ 'labels.buttons.Open in new tab' | translate }}
  </button>
  <button mat-raised-button color="primary" mat-dialog-close>
    {{ 'labels.buttons.Close' | translate }}
  </button>
</mat-dialog-actions>
