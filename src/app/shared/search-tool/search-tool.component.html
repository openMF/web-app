<!-- Toolbar icon — always visible -->
<button
  #searchTrigger
  mat-icon-button
  class="search-toggle hide-lt-sm"
  (click)="toggleSearchVisibility()"
  [matTooltip]="'labels.text.Search' | translate"
  [attr.aria-label]="'labels.text.Search' | translate"
>
  <fa-icon icon="search" size="lg"></fa-icon>
</button>

<!-- Spotlight modal -->
@if (searchVisible) {
  <div class="search-backdrop" [@backdropFade] (click)="closeModal()">
    <div
      class="spotlight-wrap"
      [@modalSlide]
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="global-search-title"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
    >
      <h2 id="global-search-title" class="cdk-visually-hidden">
        {{ 'labels.text.Search' | translate }}
      </h2>

      <!-- Input row -->
      <div class="spotlight-row">
        <fa-icon icon="search" class="spotlight-icon"></fa-icon>

        <input
          #queryInput
          cdkFocusInitial
          class="spotlight-input"
          type="text"
          [formControl]="query"
          [placeholder]="'labels.text.Search' | translate"
          (keydown.enter)="search()"
          autocomplete="off"
          spellcheck="false"
        />

        <button
          class="spotlight-go"
          type="button"
          (click)="search()"
          [attr.aria-label]="'labels.text.Search' | translate"
        >
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </div>
  </div>
}
