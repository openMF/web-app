@if (session.isSignedIn()) {
  <div class="container m-b-20 layout-row align-center gap-20px master-session-bar">
    <fa-icon icon="user-shield"></fa-icon>
    <span class="flex-fill">
      {{ 'labels.text.Signed in as master user' | translate }}: <strong>{{ session.username() }}</strong>
    </span>
    <button mat-stroked-button (click)="signOut()">
      <fa-icon icon="sign-out-alt" class="m-r-10"></fa-icon>
      {{ 'labels.buttons.Sign Out' | translate }}
    </button>
  </div>

  <router-outlet></router-outlet>
} @else {
  <mifosx-tenant-master-login></mifosx-tenant-master-login>
}
