<div class="card-menu container">
  <div class="card-grid">
    @for (card of cards; track card.label) {
      <a class="management-card" [routerLink]="card.path" tabindex="0" *mifosxHasPermission="card.permission">
        <div class="icon-circle">
          <fa-icon [icon]="card.icon" size="2x"></fa-icon>
        </div>
        <span class="card-label">{{ card.label | translate }}</span>
      </a>
    }
  </div>
</div>
