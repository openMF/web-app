@for (balance of record.balancesByCurrency; track balance.currencyCode) {
  <mat-card class="m-b-16"
    ><mat-card-content>
      <h3>{{ balance.currencyCode }}</h3>
      <p>
        <strong>{{ 'eod.' + balance.reconciliationStatus | translate }}</strong>
      </p>
      <dl>
        @for (field of fields; track field) {
          <dt>{{ 'eod.' + field | translate }}</dt>
          <dd>{{ format(balance[field], balance.decimalPlaces) }}</dd>
        }
      </dl>
    </mat-card-content></mat-card
  >
}
