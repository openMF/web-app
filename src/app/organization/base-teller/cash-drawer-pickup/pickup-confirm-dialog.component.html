<h2 mat-dialog-title>{{ 'cashPickup.confirmTransaction' | translate }}</h2>
<mat-dialog-content>
  <mifosx-pickup-summary [record]="data.preview" />
  @if (error) {
    <p role="alert">{{ error | translate }}</p>
  }
  @if (uncertain) {
    <p role="status">{{ 'cashPickup.retryHint' | translate }}</p>
  }
  <form [formGroup]="form" (ngSubmit)="confirm()" id="pickup-authorization" autocomplete="off">
    <mat-form-field class="m-r-16">
      <mat-label>{{ 'cashPickup.authorizationUsername' | translate }}</mat-label>
      <input matInput formControlName="username" autocomplete="off" [readonly]="busy" required />
    </mat-form-field>
    <mat-form-field>
      <mat-label>{{ 'cashPickup.authorizationCode' | translate }}</mat-label>
      <input
        matInput
        type="password"
        formControlName="credential"
        autocomplete="new-password"
        [readonly]="busy"
        required
      />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="busy">{{ 'cashPickup.cancel' | translate }}</button>
  <button
    mat-raised-button
    color="primary"
    type="submit"
    form="pickup-authorization"
    [disabled]="busy || form.invalid || stale"
  >
    {{ 'cashPickup.confirm' | translate }}
  </button>
</mat-dialog-actions>
