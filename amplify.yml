version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.0
        - nvm use 20.19.0
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        - node scripts/render-amplify-env.js
  artifacts:
    baseDirectory: dist/web-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
